<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#bae6fd">
<meta name="format-detection" content="telephone=no">
<title>Для Денчика 🎈</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 100%);
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 500px;
    margin: 0 auto;
    overflow: hidden;
  }

  .wedding-date {
    position: absolute;
    top: 3%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    color: #0369a1;
    font-size: 0.85rem;
    font-weight: 700;
    line-height: 1.4;
    opacity: 0.85;
    z-index: 5;
    white-space: nowrap;
  }
  .wedding-date .big {
    display: block;
    font-size: 1.1rem;
    font-weight: 900;
    color: #0284c7;
  }

  .floating-group {
    position: absolute;
    left: 50%;
    bottom: 20%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: float 3s ease-in-out infinite;
    transition: all 0.8s cubic-bezier(0.4, 0, 1, 1);
  }

  @keyframes float {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-20px); }
  }

  .floating-group.falling {
    animation: fallDown 1.5s cubic-bezier(0.5, 0, 1, 0.5) forwards;
  }

  @keyframes fallDown {
    0% { transform: translateX(-50%) translateY(0) rotate(0deg); opacity: 1; }
    20% { transform: translateX(-50%) translateY(-50px) rotate(15deg); opacity: 1; }
    100% { transform: translateX(-50%) translateY(100vh) rotate(45deg); opacity: 0; }
  }

  .balloon {
    width: 120px;
    height: 150px;
    background: radial-gradient(circle at 35% 30%, #ff7b7b, #ef4444 60%, #b91c1c);
    border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
    position: relative;
    cursor: pointer;
    box-shadow: inset -10px -10px 20px rgba(0,0,0,0.2), 0 10px 20px rgba(239,68,68,0.3);
    transition: transform 0.1s;
    z-index: 2;
  }

  .balloon::after {
    content: '';
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-bottom: 12px solid #b91c1c;
  }

  .balloon::before {
    content: '';
    position: absolute;
    top: 20px;
    left: 25px;
    width: 25px;
    height: 35px;
    background: rgba(255,255,255,0.4);
    border-radius: 50%;
    transform: rotate(-30deg);
  }

  .balloon:active { transform: scale(0.95); }

  .string {
    width: 2px;
    height: 80px;
    background: #4b5563;
    margin-top: -2px;
    z-index: 1;
    transition: opacity 0.2s;
  }

  .cat {
    width: 140px;
    height: auto;
    margin-top: -15px;
    position: relative;
    z-index: 3;
    filter: drop-shadow(0 10px 10px rgba(0,0,0,0.1));
  }

  .particle {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0;
    z-index: 10;
  }

  /* Блок з результатом */
  .result-screen {
    position: absolute;
    top: 10%;
    left: 50%;
    transform: translateX(-50%) scale(0.8);
    width: 90%;
    max-width: 350px;
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 20;
  }

  .result-screen.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
    pointer-events: auto;
  }

  .love-text {
    font-size: 1.8rem;
    font-weight: 900;
    color: #ef4444;
    text-align: center;
    line-height: 1.2;
    text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 0 10px 20px rgba(239,68,68,0.3);
    margin-bottom: 10px;
  }

  .love-text .sub {
    display: block;
    font-size: 0.85rem;
    font-weight: 700;
    color: #0369a1;
    margin-top: 8px;
    text-shadow: 1px 1px 0 #fff;
    line-height: 1.5;
  }

  /* Оновлене фото (формат картки) */
  .photo-card {
    background: #fff;
    padding: 10px 10px 16px 10px;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    margin: 15px 0;
    transform: rotate(-2deg); /* Легкий нахил для стилю */
    transition: transform 0.3s;
  }
  
  .photo-card:active {
    transform: rotate(0deg) scale(1.05);
  }

  .photo-inner {
    width: 200px;
    height: 260px; /* Вертикальний формат, щоб влізло двоє */
    overflow: hidden;
    border-radius: 6px;
    background: #fef3c7;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .photo-inner img {
    width: 100%;
    height: 100%;
    object-fit: cover; /* Заповнює рамку, зберігаючи пропорції */
  }

  .photo-caption {
    text-align: center;
    font-size: 0.8rem;
    color: #6b7280;
    font-weight: 700;
    margin-top: 8px;
  }

  /* Кнопка листа */
  .letter-btn {
    background: #fff;
    border: 2px dashed #ef4444;
    color: #ef4444;
    padding: 10px 20px;
    border-radius: 15px;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 900;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 10px rgba(239,68,68,0.15);
    transition: transform 0.2s;
    text-decoration: none;
  }

  .letter-btn:active {
    transform: scale(0.95);
  }

  .bg-heart {
    position: absolute;
    color: #fca5a5;
    opacity: 0.4;
    animation: floatUp 6s linear infinite;
    pointer-events: none;
  }

  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
    20% { opacity: 0.6; }
    100% { transform: translateY(-100px) scale(1.2); opacity: 0; }
  }

  .hint {
    position: absolute;
    bottom: 10%;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.85);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.9rem;
    font-weight: 700;
    color: #6b7280;
    white-space: nowrap;
    animation: pulse 1.5s infinite;
    pointer-events: none;
  }

  @keyframes pulse {
    0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; }
    50% { transform: translateX(-50%) scale(1.05); opacity: 0.7; }
  }

  .hint.hidden { opacity: 0; transition: opacity 0.3s; }

  .again-btn {
    position: absolute;
    bottom: 4%;
    left: 50%;
    transform: translateX(-50%) scale(0);
    background: #ef4444;
    color: #fff;
    border: none;
    padding: 10px 24px;
    border-radius: 30px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 900;
    box-shadow: 0 6px 16px rgba(239,68,68,0.4);
    cursor: pointer;
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 30;
  }
  .again-btn.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }
  .again-btn:active { transform: translateX(-50%) scale(0.95); }
</style>
</head>
<body>

<div class="scene" id="scene">
  <div class="wedding-date">
    <span class="big">9 листопада 2021</span>
    вівторок · наш день 💍
  </div>

  <div id="heartsContainer"></div>

  <div class="result-screen" id="resultScreen">
    <div class="love-text">
      Я тебе люблю,<br>мій Денчік! ❤️
      <span class="sub" id="daysSub"></span>
    </div>

    <!-- НОВЕ ФОТО: Формат картки -->
    <div class="photo-card">
      <div class="photo-inner">
        <img src="photo.jpg" alt="Наше фото" onerror="this.style.display='none'; this.parentNode.innerHTML='<span style=\'font-size:3rem;\'>📸</span>';">
      </div>
      <div class="photo-caption">Наша родина 💛</div>
    </div>

    <a href="#" class="letter-btn" id="letterBtn">
      💌 Відкрити лист
    </a>
  </div>

  <div class="hint" id="hint">Лопни кульку 👆</div>

  <div class="floating-group" id="group">
    <div class="balloon" id="balloon"></div>
    <div class="string" id="string"></div>
    <svg class="cat" id="cat" viewBox="0 0 200 180" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="150" cy="150" rx="20" ry="15" fill="#f59e0b"/>
      <ellipse cx="150" cy="155" rx="15" ry="8" fill="#fef3c7"/>
      <ellipse cx="100" cy="130" rx="55" ry="45" fill="#fcd34d"/>
      <ellipse cx="100" cy="140" rx="35" ry="30" fill="#fef3c7"/>
      <path d="M 155 135 Q 175 115 165 95" stroke="#fcd34d" stroke-width="14" stroke-linecap="round" fill="none"/>
      <ellipse cx="85" cy="85" rx="45" ry="40" fill="#fcd34d"/>
      <path d="M 50 65 L 40 35 L 65 55 Z" fill="#f59e0b"/>
      <path d="M 50 65 L 45 45 L 60 58 Z" fill="#fbcfe8"/>
      <path d="M 120 65 L 130 35 L 105 55 Z" fill="#f59e0b"/>
      <path d="M 120 65 L 125 45 L 110 58 Z" fill="#fbcfe8"/>
      <ellipse cx="85" cy="95" rx="30" ry="22" fill="#fef3c7"/>
      <path d="M 65 85 Q 72 78 79 85" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M 91 85 Q 98 78 105 85" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round"/>
      <ellipse cx="60" cy="95" rx="8" ry="5" fill="#fca5a5" opacity="0.6"/>
      <ellipse cx="110" cy="95" rx="8" ry="5" fill="#fca5a5" opacity="0.6"/>
      <path d="M 82 92 L 88 92 L 85 96 Z" fill="#fca5a5"/>
      <path d="M 80 100 Q 85 98 90 100" stroke="#78350f" stroke-width="2" fill="none" stroke-linecap="round"/>
      <line x1="45" y1="92" x2="60" y2="92" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="45" y1="98" x2="60" y2="96" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="125" y1="92" x2="110" y2="92" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="125" y1="98" x2="110" y2="96" stroke="#78350f" stroke-width="1.5" stroke-linecap="round"/>
      <ellipse cx="85" cy="115" rx="12" ry="10" fill="#f59e0b"/>
      <ellipse cx="85" cy="115" rx="8" ry="6" fill="#fef3c7"/>
    </svg>
  </div>

  <button class="again-btn" id="againBtn">Ще раз 💫</button>
</div>

<script>
  const balloon = document.getElementById('balloon');
  const group = document.getElementById('group');
  const stringEl = document.getElementById('string');
  const resultScreen = document.getElementById('resultScreen');
  const hint = document.getElementById('hint');
  const scene = document.getElementById('scene');
  const heartsContainer = document.getElementById('heartsContainer');
  const againBtn = document.getElementById('againBtn');
  const daysSub = document.getElementById('daysSub');
  const letterBtn = document.getElementById('letterBtn');

  let isPopped = false;
  let heartsInterval = null;

  const weddingDate = new Date(2021, 10, 9); 

  function updateDaysCounter() {
    const now = new Date();
    const diffMs = now - weddingDate;
    const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    daysSub.innerHTML = `Разом уже ${days} днів 💛<br>Ми з синочком дуже тебе чекаємо!`;
  }

  const letterText = encodeURIComponent(
    "Привіт, мій любий Денчику, муж! ❤️\n\n" +
    "Ця кулька летіла до тебе з дому. Ми з Максом завжди думаємо про тебе " +
    "Ти наша опора і провода. Обіймаємо тебе міцно-міцно!\n\n" +
    "Я тебе люблю! Твоя Леся,жінка 💌"
  );
  
  const phoneNumber = "380678008141";
  letterBtn.href = `https://wa.me/${phoneNumber}?text=${letterText}`;

  function playPopSound() {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    } catch(e) {}
  }

  function vibrate() {
    if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
  }

  function createParticles(x, y) {
    const sceneRect = scene.getBoundingClientRect();
    const localX = x - sceneRect.left;
    const localY = y - sceneRect.top;
    const colors = ['#ef4444', '#f59e0b', '#3b82f6', '#10b981', '#8b5cf6', '#ec4899'];

    for (let i = 0; i < 30; i++) {
      const particle = document.createElement('div');
      particle.className = 'particle';
      particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      particle.style.left = localX + 'px';
      particle.style.top = localY + 'px';
      scene.appendChild(particle);

      const angle = Math.random() * Math.PI * 2;
      const velocity = 50 + Math.random() * 150;
      const tx = Math.cos(angle) * velocity;
      const ty = Math.sin(angle) * velocity - 50;

      particle.animate([
        { transform: 'translate(0, 0) scale(1)', opacity: 1 },
        { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
      ], {
        duration: 800 + Math.random() * 400,
        easing: 'cubic-bezier(0, 0.9, 0.57, 1)'
      }).onfinish = () => particle.remove();
    }
  }

  function popBalloon(e) {
    if (isPopped) return;
    isPopped = true;

    const rect = balloon.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    playPopSound();
    vibrate();

    balloon.style.display = 'none';
    stringEl.style.display = 'none';
    hint.classList.add('hidden');

    createParticles(centerX, centerY);
    group.classList.add('falling');

    setTimeout(() => {
      resultScreen.classList.add('show');
      startBackgroundHearts();
      againBtn.classList.add('show');
    }, 400);
  }

  balloon.addEventListener('click', popBalloon);
  balloon.addEventListener('touchstart', (e) => { e.preventDefault(); popBalloon(e); }, { passive: false });

  function startBackgroundHearts() {
    if (heartsInterval) return;
    heartsInterval = setInterval(() => {
      const heart = document.createElement('div');
      heart.className = 'bg-heart';
      heart.textContent = '❤️';
      heart.style.left = Math.random() * 100 + '%';
      heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
      heart.style.animationDuration = (Math.random() * 2 + 4) + 's';
      heartsContainer.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }, 300);
  }

  function resetGame() {
    isPopped = false;
    balloon.style.display = '';
    stringEl.style.display = '';
    hint.classList.remove('hidden');
    resultScreen.classList.remove('show');
    againBtn.classList.remove('show');
    group.classList.remove('falling');
    group.style.animation = 'none';
    void group.offsetWidth;
    group.style.animation = '';
    if (heartsInterval) {
      clearInterval(heartsInterval);
      heartsInterval = null;
    }
  }

  againBtn.addEventListener('click', resetGame);

  updateDaysCounter();
</script>
</body>
</html>
